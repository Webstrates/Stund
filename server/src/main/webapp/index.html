<!DOCTYPE html>
<!--
  Stund Session History Server — static frontpage

  The server's root page: a purely visual, single-file landing with no
  server information on it beyond the product name. Zero dependencies —
  every byte is served by the SessionHistoryServer itself.

  Copyright (c) 2026 Janus Kristensen - CAVI, Center for Advanced
  Visualization and Interaction - Aarhus University
  SPDX-License-Identifier: MIT
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stund Session History Server</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%232dd4bf'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230d1117'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #05070c;
            --teal: #2dd4bf;
            --violet: #a78bfa;
            --text: #d7dee8;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* the animated backdrop — a canvas is a replaced element, so the
           offset pair alone would leave it at its intrinsic 300×150; it
           needs explicit dimensions (percentages on a fixed element
           resolve against the viewport) */
        #backdrop {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            display: block;
            background:
                radial-gradient(1200px 700px at 50% 115%, rgba(45, 212, 191, .10), transparent 60%),
                radial-gradient(900px 600px at 50% -20%, rgba(167, 139, 250, .08), transparent 60%),
                var(--bg);
        }

        /* the centerpiece */
        main {
            position: relative; z-index: 1;
            height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 34px;
            padding: 24px;
            text-align: center;
        }

        .mark { position: relative; width: 132px; height: 132px; }
        .mark .ring, .mark .ring::before, .mark .core {
            position: absolute; inset: 0; border-radius: 50%;
        }
        .mark .ring {
            border: 1.5px solid rgba(45, 212, 191, .55);
            box-shadow: 0 0 40px rgba(45, 212, 191, .25), inset 0 0 24px rgba(45, 212, 191, .12);
            animation: breathe 4.5s ease-in-out infinite;
        }
        .mark .ring::before {
            content: "";
            inset: 11px;
            border: 1px dashed rgba(167, 139, 250, .45);
            animation: orbit 26s linear infinite;
        }
        .mark .core {
            inset: 34px;
            background: radial-gradient(circle at 42% 38%, #4ef0dd, var(--teal) 55%, #14877b);
            box-shadow: 0 0 34px rgba(45, 212, 191, .65);
        }
        .mark .core::after {
            content: "";
            position: absolute; inset: 30%; border-radius: 50%;
            background: var(--bg);
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1);     box-shadow: 0 0 40px rgba(45, 212, 191, .25), inset 0 0 24px rgba(45, 212, 191, .12); }
            50%      { transform: scale(1.045); box-shadow: 0 0 66px rgba(45, 212, 191, .40), inset 0 0 24px rgba(45, 212, 191, .20); }
        }
        @keyframes orbit { to { transform: rotate(360deg); } }

        h1 {
            margin: 0;
            font-size: clamp(28px, 5.4vw, 58px);
            font-weight: 250;
            letter-spacing: .34em;
            text-transform: uppercase;
            text-indent: .34em; /* re-center after the tracking */
            background: linear-gradient(100deg, #eef4fb 15%, var(--teal) 48%, var(--violet) 82%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 26px rgba(45, 212, 191, .28));
            animation: shimmer 7s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { filter: drop-shadow(0 0 22px rgba(45, 212, 191, .22)); }
            50%      { filter: drop-shadow(0 0 34px rgba(167, 139, 250, .34)); }
        }

        /* narrow screens: the name wraps naturally (nothing glues the words
           together), so ease the tracking and floor until every word fits */
        @media (max-width: 480px) {
            h1 {
                font-size: clamp(24px, 6.6vw, 34px);
                letter-spacing: .18em;
                text-indent: .18em;
            }
        }

        .beam {
            width: min(420px, 70vw); height: 1px;
            background: linear-gradient(90deg, transparent, rgba(45, 212, 191, .8), rgba(167, 139, 250, .8), transparent);
            transform: scaleX(0);
            animation: unfold 2.2s .4s cubic-bezier(.2, .8, .2, 1) forwards;
        }
        @keyframes unfold { to { transform: scaleX(1); } }

        /* graceful static fallback: no motion, same composition */
        @media (prefers-reduced-motion: reduce) {
            .mark .ring, .mark .ring::before, h1, .beam { animation: none; }
            .beam { transform: scaleX(1); }
            h1 { filter: none; }
        }
    </style>
</head>
<body>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <main>
        <div class="mark" aria-hidden="true">
            <div class="ring"></div>
            <div class="core"></div>
        </div>
        <h1>Stund Session History Server</h1>
        <div class="beam" aria-hidden="true"></div>
    </main>

    <script>
    "use strict";
    /* The drifting backdrop: a light starfield and a slowly scrolling horizon
       grid — one canvas, one rAF loop, no libraries. Motion is derived from
       timestamps, not frame counts, so it runs identically at any refresh
       rate. Honors prefers-reduced-motion by drawing a single static frame.
       Nothing here talks to the server; the page is fully static. */
    (function () {
        const canvas = document.getElementById("backdrop");
        const ctx = canvas.getContext("2d");
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

        const stars = [];
        const STAR_COUNT = 140;
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random(), y: Math.random(),
                r: 0.4 + Math.random() * 1.4,
                speed: 0.008 + Math.random() * 0.03, // viewport heights per second
                twinkle: Math.random() * Math.PI * 2,
            });
        }
        function color(star, alpha) {
            // teal for most, violet for a few
            return star.r > 1.1
                ? `rgba(167, 139, 250, ${alpha})`
                : `rgba(45, 212, 191, ${alpha})`;
        }

        let lastT = null;

        function draw(t) {
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.clientWidth, h = canvas.clientHeight;
            const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
            // compare rounded sizes: a fractional dpr would otherwise re-assign
            // the (integer-only) backing store on every frame
            if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);

            // horizon grid — converging lines + horizontal rails, scrolling up
            const horizon = h * 0.86;
            ctx.strokeStyle = "rgba(45, 212, 191, 0.06)";
            ctx.lineWidth = 1;
            const vanishX = w / 2;
            for (let i = -10; i <= 10; i++) {
                ctx.beginPath();
                ctx.moveTo(vanishX + i * (w / 14), h);
                ctx.lineTo(vanishX + i * (w / 190), horizon - h * 0.16);
                ctx.stroke();
            }
            for (let j = 0; j < 7; j++) {
                const p = ((j + (reduced ? 0 : (t / 9000) % 1)) / 7);
                const y = horizon - Math.pow(1 - p, 2.4) * (h * 0.42);
                ctx.globalAlpha = 0.05 + 0.22 * p;
                ctx.beginPath();
                ctx.moveTo(0, y); ctx.lineTo(w, y);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // stars drifting upward, twinkling — drift from elapsed time, so
            // the rate is independent of the display's refresh rate (at 60 Hz
            // the per-frame step is exactly the designed speed/60). Stars span
            // the FULL viewport height — they do not stop at the horizon.
            for (const s of stars) {
                if (!reduced) {
                    const dt = lastT == null ? 16 : Math.min(100, t - lastT);
                    s.y -= s.speed * dt / 1000;
                    if (s.y < -0.02) s.y = 1.02;
                }
                const alpha = 0.25 + 0.5 * Math.abs(Math.sin(s.twinkle + (reduced ? 0 : t / 1400)));
                ctx.fillStyle = color(s, alpha);
                ctx.beginPath();
                ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
                ctx.fill();
            }

            if (!reduced) { lastT = t; requestAnimationFrame(draw); }
        }
        requestAnimationFrame(draw);
    })();
    </script>
</body>
</html>
